name: Fetch 3 Years Historical Data

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas requests
      - name: Fetch 3 years data
        run: |
          python main.py historical 2023-05-15 2026-05-15
          cp historical_data_2023-05-15_to_2026-05-15.csv data_3years.csv
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data_3years.csv data.csv
          git diff --staged --quiet || git commit -m "feat: 添加3年历史汇率数据"
          git push
