name: Deploy BOC Exchange Rate Website

on:
  schedule:
    # 每天北京时间11:00（UTC 03:00）部署网站（比抓取任务晚30分钟）
    - cron: '30 3 * * *'
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'site/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Pages
      uses: actions/configure-pages@v4

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: 'site'

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
