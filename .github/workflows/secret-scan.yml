name: Security - Secret Scan

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  # 手动触发，便于随时复查
  workflow_dispatch:

# 权限最小化：只需读，禁止写入令牌
permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 拉全历史，连历史里的泄露一起扫

      # 用 gitleaks 官方的 GitHub Action 做扫描，任何疑似密钥直接 fail
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # v2 默认在【全历史 + 当前工作区】都扫，任何疑似密钥直接失败（非0退出）并阻断本次 push/PR
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "true"
          GITLEAKS_ENABLE_COMMENTS: "false"
