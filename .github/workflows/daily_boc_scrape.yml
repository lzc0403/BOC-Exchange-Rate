name: Daily BOC Exchange Rate Scraping

on:
  schedule:
    # 每天上午09:30执行（提前1小时，防止队列延迟导致下午才跑）
    - cron: '30 1 * * *'  # UTC时间，对应北京时间09:30
  workflow_dispatch:  # 支持手动触发
    inputs:
      mode:
        description: '运行模式'
        required: true
        default: 'daily'
        type: choice
        options:
          - daily
          - backfill

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  scrape-exchange-rates:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Create .env file
      run: |
        echo "SMTP_SERVER=${{ secrets.SMTP_SERVER }}" >> .env
        echo "SMTP_PORT=587" >> .env
        echo "SENDER_EMAIL=${{ secrets.SENDER_EMAIL }}" >> .env
        echo "SENDER_PASSWORD=${{ secrets.SENDER_PASSWORD }}" >> .env
        echo "RECIPIENT_EMAIL=${{ secrets.RECIPIENT_EMAIL }}" >> .env

    - name: Run BOC scraper
      env:
        SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
        SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
        SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
        RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        DAILY_MODE: ${{ github.event.inputs.mode == 'daily' || github.event_name == 'schedule' }}
        # 打码平台 Key（CapSolver 主 / 可选 2Captcha 备）
        CAPSOLVER_API_KEY: ${{ secrets.CAPSOLVER_API_KEY }}
        TWOCAPTCHA_API_KEY: ${{ secrets.TWOCAPTCHA_API_KEY }}
      run: |
        if [ "${{ github.event.inputs.mode }}" = "backfill" ]; then
          echo "== 运行补全模式(backfill): verify_and_backfill.py =="
          python verify_and_backfill.py --max-days 60
        else
          echo "== 运行每日模式(daily): boc_scraper_v6.1.py =="
          python boc_scraper_v6.1.py
        fi

    - name: Send daily emails to subscribers
      continue-on-error: true
      env:
        SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
        SMTP_PORT: 587
        SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
        SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
        RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        SUBSCRIBER_API_URL: ${{ secrets.SUBSCRIBER_API_URL }}
        SUBSCRIBER_API_KEY: ${{ secrets.SUBSCRIBER_API_KEY }}
        UNSUBSCRIBE_BASE_URL: "https://lzc0403.github.io/BOC-Exchange-Rate/"
      run: |
        python send_daily_emails.py

    - name: Sync data to site directory
      run: |
        # 港币 CSV 由爬虫在 root 生成；缺失时跳过（2>/dev/null || true）避免整条失败
        cp boc_usd_cny.csv site/boc_usd_cny.csv 2>/dev/null || true
        cp boc_hkd_cny.csv site/boc_hkd_cny.csv 2>/dev/null || true
        echo "数据已同步到site目录"

    - name: Commit and push changes
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git
        # 文件可能不存在（如当日无新数据/无 Key），用 2>/dev/null || true 兜底
        git add boc_usd_cny.csv boc_hkd_cny.csv site/ 2>/dev/null || true
        git diff --staged --quiet && echo "无数据变更，跳过提交" || (git commit -m "更新汇率数据 $(date +'%Y-%m-%d')" && git push)

    - name: Upload results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: boc-data-${{ github.run_id }}
        path: |
          boc_usd_cny.csv
          boc_hkd_cny.csv
          boc.log

    - name: Upload site as Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: site/

  deploy-pages:
    needs: scrape-exchange-rates
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4