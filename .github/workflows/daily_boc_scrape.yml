name: Daily BOC Exchange Rate Scraping

on:
  schedule:
    # 每天上午10:30执行
    - cron: '30 2 * * *'  # UTC时间，对应北京时间10:30
  workflow_dispatch:  # 支持手动触发

jobs:
  scrape-exchange-rates:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Create .env file
      run: |
        echo "SMTP_SERVER=${{ secrets.SMTP_SERVER }}" >> .env
        echo "SMTP_PORT=587" >> .env
        echo "SENDER_EMAIL=${{ secrets.SENDER_EMAIL }}" >> .env
        echo "SENDER_PASSWORD=${{ secrets.SENDER_PASSWORD }}" >> .env
        echo "RECIPIENT_EMAIL=${{ secrets.RECIPIENT_EMAIL }}" >> .env

    - name: Run BOC scraper
      env:
        SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
        SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
        SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
        RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
      run: |
        python boc_scraper_v6.1.py

    - name: Upload results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: boc-data-${{ github.run_id }}
        path: |
          boc_usd_cny.csv
          boc.log