name: Get Daily Exchange Rate

on:
  schedule:
    # 每天北京时间 10:05 运行（UTC 2:05）
    - cron: '5 2 * * *'
  workflow_dispatch: # 支持手动触发

jobs:
  fetch-rate:
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        
      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: 安装依赖
        run: pip install -r requirements.txt
        
      - name: 获取今日汇率
        run: python main.py daily
        
      - name: 提交结果到仓库
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add data.csv
          git diff --staged --quiet || git commit -m "Update daily rate: $(date +%Y-%m-%d)"
          git push