name: Daily BOC Rate Automation

on:
  schedule:
    # 每天北京时间 10:05 触发运行 (对应 UTC 时间 02:05)
    - cron: '5 2 * * *'
  workflow_dispatch: # 开启手动触发按钮

permissions:
  contents: write

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Scraper
        run: python main.py daily

      - name: Push Data Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.csv
          git diff --staged --quiet || git commit -m "Update rate: $(date +'%Y-%m-%d')"
          git push
