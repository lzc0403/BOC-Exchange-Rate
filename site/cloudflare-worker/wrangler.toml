name = "boc-subscription-api"
main = "worker.js"
compatibility_date = "2026-05-01"

# KV namespace for storing subscriber emails
[[kv_namespaces]]
binding = "BOC_SUBSCRIBERS"
id = ""  # 请替换为你的KV namespace ID

# ============================================================================
# 密钥配置（重要，请勿把真实密钥写在 [vars] 中）
# ----------------------------------------------------------------------------
# [vars] 中的变量是明文、可被任何能读取 worker 配置的人看到，且随代码一起部署。
# 真实密钥必须用 Cloudflare 的加密 secret 存储，部署时通过以下命令设置：
#
#   wrangler secret put SUBSCRIBER_API_KEY
#   wrangler secret put UNSUBSCRIBE_SECRET
#
# 两者说明：
#   SUBSCRIBER_API_KEY  —— 保护 GET /subscribers 接口的鉴权密钥（请求头 X-API-Key）。
#   UNSUBSCRIBE_SECRET  —— 用于对退订链接进行 HMAC 签名/校验的密钥（推荐独立设置）。
#                          若未单独设置，worker 会自动回退使用 SUBSCRIBER_API_KEY。
#                          注意：send_daily_emails.py 生成退订链接时使用相同的优先级
#                          （先 UNSUBSCRIBE_SECRET，再 SUBSCRIBE_API_KEY），两端必须一致。
#
# 要求：密钥长度必须 >= 16 个字符，且为高熵随机串。
# 建议生成方式（任选其一）：
#   openssl rand -base64 32
#   python -c "import secrets; print(secrets.token_urlsafe(32))"
#
# fail-closed 行为：若 SUBSCRIBER_API_KEY 未配置或长度不足，GET /subscribers 一律返回 503；
#                   若两个退订密钥均未配置，退订接口一律返回 503。绝不放行。
# ============================================================================

# Variables（仅存放非敏感配置；不要在这里放任何密钥）
[vars]
# 注意：不要在此处设置 SUBSCRIBER_API_KEY / UNSUBSCRIBE_SECRET 的占位值，
# 请使用上方的 `wrangler secret put` 命令设置。留空占位会诱导误部署为明文普通变量。

# Routes
routes = [
  { pattern = "api.monica-rate.com", custom_domain = true }
]
